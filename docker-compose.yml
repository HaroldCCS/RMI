version: "3.9"

services:

  # ── Base de datos MySQL ────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: bank_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE:      bank
      MYSQL_USER:          bankuser
      MYSQL_PASSWORD:      bankpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bankuser", "-pbankpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Servidor RMI ──────────────────────────────────────────────────────────
  server:
    build: ./server
    container_name: bank_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:     db
      DB_PORT:     "3306"
      DB_NAME:     bank
      DB_USER:     bankuser
      DB_PASS:     bankpass
      SERVER_HOST: localhost
    ports:
      - "1099:1099"   # RMI Registry
      - "1098:1098"   # RMI Object (puerto fijo exportado por BankServiceImpl)

  # ── Cliente Swing (GUI) ───────────────────────────────────────────────────
  # NOTA: Requiere servidor X11 en el host.
  # macOS: instalar XQuartz y ejecutar:  xhost + localhost
  # Linux: ejecutar: xhost +local:docker
  client:
    build: ./client
    container_name: bank_client
    depends_on:
      - server
    environment:
      RMI_HOST: server
      RMI_PORT: "1099"
      DISPLAY:  ${DISPLAY:-host.docker.internal:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Permite acceso a la pantalla del host en macOS con XQuartz
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

volumes:
  db_data:
